
<h2 class="sr-only">Interactive equivalent circuit diagram for NWFET gate stack EIS model</h2>
<style>
  .circuit-wrap { padding: 0.5rem 0; }
  .controls { display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin:0 0 12px; font-size:13px; color:var(--color-text-secondary); }
  .controls select, .controls button { font-size:13px; }
  .pill { display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:var(--border-radius-md); font-size:12px; font-weight:500; }
  .pill-rs { background:var(--color-background-info); color:var(--color-text-info); }
  .pill-ox { background:#EAF3DE; color:#3B6D11; }
  .pill-dep { background:#FAEEDA; color:#854F0B; }
  .pill-it { background:#FBEAF0; color:#993556; }
  @media(prefers-color-scheme:dark) {
    .pill-ox { background:#27500A; color:#C0DD97; }
    .pill-dep { background:#412402; color:#FAC775; }
    .pill-it { background:#4B1528; color:#F4C0D1; }
  }
  #info-panel { font-size:13px; color:var(--color-text-secondary); min-height:48px; padding:8px 12px; border-radius:var(--border-radius-md); background:var(--color-background-secondary); margin-top:12px; line-height:1.6; }
  .param-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:8px; margin-top:10px; }
  .param-card { background:var(--color-background-primary); border:0.5px solid var(--color-border-tertiary); border-radius:var(--border-radius-md); padding:8px 10px; }
  .param-card .label { font-size:11px; color:var(--color-text-tertiary); }
  .param-card .value { font-size:15px; font-weight:500; margin-top:2px; }
</style>
<div class="circuit-wrap">
  <div class="controls">
    <label>Gate:
      <select id="gate-sel" onchange="updateCircuit()">
        <option value="pi">π-Gate (η=0.82)</option>
        <option value="omega">Ω-Gate (η=0.98)</option>
      </select>
    </label>
    <label>Dielectric:
      <select id="diel-sel" onchange="updateCircuit()">
        <option value="SiO2">SiO₂ (k=3.9)</option>
        <option value="Al2O3">Al₂O₃ (k=9.0)</option>
        <option value="HfO2" selected>HfO₂ (k=25.0)</option>
        <option value="ZrO2">ZrO₂ (k=22.0)</option>
        <option value="La2O3">La₂O₃ (k=27.0)</option>
      </select>
    </label>
    <label>Temp:
      <select id="temp-sel" onchange="updateCircuit()">
        <option value="77">77 K</option>
        <option value="300" selected>300 K</option>
        <option value="373">373 K</option>
        <option value="600">600 K</option>
      </select>
    </label>
  </div>
  <svg width="100%" viewBox="0 0 680 310" role="img">
    <title>NWFET gate stack equivalent circuit</title>
    <desc>Series connection of Rs, parallel Rox-Cox, and parallel Cd-Git-Cit</desc>
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>
    <line x1="20" y1="120" x2="60" y2="120" stroke="var(--s)" stroke-width="1.5"/>
    <circle cx="20" cy="120" r="4" fill="var(--s)" stroke="var(--s)" stroke-width="1"/>
    <text class="ts" x="20" y="108" text-anchor="middle">V_in</text>
    <g class="node" onclick="showInfo('rs')" style="cursor:pointer">
      <rect x="60" y="100" width="80" height="40" rx="4" fill="var(--color-background-info)" stroke="#185FA5" stroke-width="0.5"/>
      <text class="th" x="100" y="120" text-anchor="middle" dominant-baseline="central" fill="#0C447C">R_s</text>
    </g>
    <text class="ts" x="100" y="156" text-anchor="middle">Series</text>
    <text class="ts" x="100" y="170" text-anchor="middle">resistance</text>
    <line x1="140" y1="120" x2="180" y2="120" stroke="var(--s)" stroke-width="1.5"/>
    <text class="ts" x="160" y="108" text-anchor="middle" fill="var(--t)">A</text>
    <g id="block2">
      <rect x="180" y="46" width="180" height="148" rx="10" fill="none" stroke="var(--b)" stroke-width="0.5" stroke-dasharray="4 3"/>
      <text class="ts" x="270" y="38" text-anchor="middle">Oxide layer</text>
      <line x1="180" y1="120" x2="200" y2="120" stroke="var(--s)" stroke-width="1.5"/>
      <line x1="200" y1="120" x2="200" y2="76" stroke="var(--s)" stroke-width="1.5"/>
      <line x1="200" y1="120" x2="200" y2="164" stroke="var(--s)" stroke-width="1.5"/>
      <g class="node" onclick="showInfo('rox')" style="cursor:pointer">
        <rect x="210" y="56" width="100" height="40" rx="4" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
        <text class="th" x="260" y="76" text-anchor="middle" dominant-baseline="central" fill="#27500A">R_ox</text>
      </g>
      <g class="node" onclick="showInfo('cox')" style="cursor:pointer">
        <rect x="210" y="144" width="100" height="40" rx="4" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
        <text class="th" x="260" y="164" text-anchor="middle" dominant-baseline="central" fill="#27500A">C_ox</text>
      </g>
      <line x1="310" y1="76" x2="340" y2="76" stroke="var(--s)" stroke-width="1.5"/>
      <line x1="310" y1="164" x2="340" y2="164" stroke="var(--s)" stroke-width="1.5"/>
      <line x1="340" y1="76" x2="340" y2="164" stroke="var(--s)" stroke-width="1.5"/>
      <line x1="340" y1="120" x2="360" y2="120" stroke="var(--s)" stroke-width="1.5"/>
    </g>
    <text class="ts" x="370" y="108" text-anchor="middle" fill="var(--t)">B</text>
    <line x1="360" y1="120" x2="390" y2="120" stroke="var(--s)" stroke-width="1.5"/>
    <g id="block3">
      <rect x="390" y="26" width="230" height="208" rx="10" fill="none" stroke="var(--b)" stroke-width="0.5" stroke-dasharray="4 3"/>
      <text class="ts" x="505" y="18" text-anchor="middle">Depletion + interface traps</text>
      <line x1="390" y1="120" x2="410" y2="120" stroke="var(--s)" stroke-width="1.5"/>
      <line x1="410" y1="120" x2="410" y2="56" stroke="var(--s)" stroke-width="1.5"/>
      <line x1="410" y1="120" x2="410" y2="184" stroke="var(--s)" stroke-width="1.5"/>
      <g class="node" onclick="showInfo('cd')" style="cursor:pointer">
        <rect x="420" y="36" width="90" height="40" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
        <text class="th" x="465" y="56" text-anchor="middle" dominant-baseline="central" fill="#633806">C_d</text>
      </g>
      <g class="node" onclick="showInfo('git')" style="cursor:pointer">
        <rect x="420" y="100" width="90" height="40" rx="4" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
        <text class="th" x="465" y="120" text-anchor="middle" dominant-baseline="central" fill="#72243E">G_it</text>
      </g>
      <g class="node" onclick="showInfo('cit')" style="cursor:pointer">
        <rect x="420" y="164" width="90" height="40" rx="4" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
        <text class="th" x="465" y="184" text-anchor="middle" dominant-baseline="central" fill="#72243E">C_it</text>
      </g>
      <line x1="510" y1="56" x2="580" y2="56" stroke="var(--s)" stroke-width="1.5"/>
      <line x1="510" y1="120" x2="580" y2="120" stroke="var(--s)" stroke-width="1.5"/>
      <line x1="510" y1="184" x2="580" y2="184" stroke="var(--s)" stroke-width="1.5"/>
      <line x1="580" y1="56" x2="580" y2="184" stroke="var(--s)" stroke-width="1.5"/>
      <line x1="580" y1="120" x2="620" y2="120" stroke="var(--s)" stroke-width="1.5"/>
    </g>
    <line x1="620" y1="120" x2="660" y2="120" stroke="var(--s)" stroke-width="1.5"/>
    <circle cx="660" cy="120" r="4" fill="var(--s)" stroke="var(--s)" stroke-width="1"/>
    <text class="ts" x="660" y="108" text-anchor="middle">V_out</text>
    <text class="ts" x="270" y="218" text-anchor="middle">
      Z_total = R_s + (R_ox ‖ C_ox) + (C_d ‖ G_it ‖ C_it)
    </text>
    <line x1="20" y1="260" x2="660" y2="260" stroke="var(--s)" stroke-width="1" stroke-dasharray="2 4" opacity="0.3"/>
    <text class="ts" x="100" y="278" text-anchor="middle">
      <tspan fill="#185FA5">■</tspan> Contacts + channel
    </text>
    <text class="ts" x="270" y="278" text-anchor="middle">
      <tspan fill="#3B6D11">■</tspan> Gate oxide bulk
    </text>
    <text class="ts" x="505" y="278" text-anchor="middle">
      <tspan fill="#993556">■</tspan> Interface traps
    </text>
    <text class="ts" x="465" y="292" text-anchor="middle">
      <tspan fill="#854F0B">■</tspan> Depletion
    </text>
  </svg>
  <div id="info-panel">Click any component to see its physics and extracted value for the selected gate, dielectric, and temperature.</div>
  <div class="param-grid" id="param-grid"></div>
</div>
<script>
const diels = {
  SiO2:  {k:3.9, k_inf:2.1, tau0:1e-12, Ea:0.35, alpha:0.05, sig:1e-15, Eg:9.0, Dit:5e10},
  Al2O3: {k:9.0, k_inf:3.2, tau0:5e-11, Ea:0.40, alpha:0.12, sig:1e-13, Eg:8.8, Dit:8e10},
  HfO2:  {k:25.0,k_inf:5.0, tau0:1e-10, Ea:0.45, alpha:0.18, sig:1e-12, Eg:5.8, Dit:2e11},
  ZrO2:  {k:22.0,k_inf:4.6, tau0:8e-11, Ea:0.42, alpha:0.15, sig:5e-13, Eg:5.8, Dit:1.5e11},
  La2O3: {k:27.0,k_inf:5.5, tau0:2e-10, Ea:0.50, alpha:0.22, sig:5e-12, Eg:5.5, Dit:3e11}
};
const eps0=8.854e-12, qe=1.602e-19, kB=1.381e-23, tox=3e-9;
const Agate=2*Math.PI*5e-9*20e-9;
function getEta(){return document.getElementById('gate-sel').value==='pi'?0.82:0.98}
function getD(){return diels[document.getElementById('diel-sel').value]}
function getT(){return +document.getElementById('temp-sel').value}
function Cox(){const d=getD();return eps0*d.k*getEta()/tox}
function Rs(){return(document.getElementById('gate-sel').value==='pi'?500:400)*Math.pow(getT()/300,0.3)}
function Rox(){const d=getD(),T=getT();const sig=d.sig*Math.exp(-d.Eg*qe/(2*kB)*(1/T-1/300));return tox/(sig*Agate)}
function Cd(){const T=getT();const phiF=kB*T/qe*Math.log(1e24/1.5e16);const Wd=Math.sqrt(2*11.7*eps0*2*Math.abs(phiF)/(qe*1e24));return 11.7*eps0/Wd}
function Dit(){const d=getD();let v=d.Dit;if(document.getElementById('gate-sel').value==='omega')v*=0.85;return v}
function tauIt(){const d=getD(),T=getT();return d.tau0*10*Math.exp(d.Ea*0.8*qe/(kB*T))}
function fmt(v,u){if(Math.abs(v)>1e15)return(v/1e15).toFixed(1)+' P'+u;if(Math.abs(v)>1e12)return(v/1e12).toFixed(1)+' T'+u;if(Math.abs(v)>1e9)return(v/1e9).toFixed(1)+' G'+u;if(Math.abs(v)>1e6)return(v/1e6).toFixed(1)+' M'+u;if(Math.abs(v)>1e3)return(v/1e3).toFixed(1)+' k'+u;if(Math.abs(v)>1)return v.toFixed(2)+' '+u;if(Math.abs(v)>1e-3)return(v*1e3).toFixed(2)+' m'+u;if(Math.abs(v)>1e-6)return(v*1e6).toFixed(2)+' μ'+u;if(Math.abs(v)>1e-9)return(v*1e9).toFixed(2)+' n'+u;if(Math.abs(v)>1e-12)return(v*1e12).toFixed(2)+' p'+u;return v.toExponential(2)+' '+u}
const info = {
  rs: () => `<b>R_s (series resistance)</b> — contact + channel resistance. Increases with T due to phonon scattering. Value: <b>${fmt(Rs(),'Ω')}</b>. ${document.getElementById('gate-sel').value==='omega'?'Omega-Gate has lower R_s (400 Ω base) due to better contact geometry.':'Pi-Gate has R_s = 500 Ω base.'}`,
  rox: () => `<b>R_ox (oxide leakage resistance)</b> — parallel path through oxide bulk via defect-assisted tunnelling. Value: <b>${fmt(Rox(),'Ω')}</b>. Higher bandgap → higher R_ox. Temperature increases leakage exponentially (Arrhenius).`,
  cox: () => `<b>C_ox (oxide capacitance)</b> — C_ox = η·ε₀·ε_r/t_ox. Value: <b>${fmt(Cox()*Agate,'F')}</b> (${(Cox()*1e3).toFixed(1)} mF/m²). Higher η (Omega) and higher k both increase C_ox.`,
  cd: () => `<b>C_d (depletion capacitance)</b> — semiconductor depletion layer capacitance. Value: <b>${fmt(Cd()*Agate,'F')}</b>. Affects the capacitive divider ratio C_d/(η·C_ox) in the SS equation.`,
  git: () => `<b>G_it (interface trap conductance)</b> — energy loss from carrier capture/emission at Si/oxide interface. D_it = <b>${Dit().toExponential(1)} cm⁻²eV⁻¹</b>. τ_it = <b>${fmt(tauIt(),'s')}</b>. Extracted via conductance method. Omega-Gate reduces D_it by 15%.`,
  cit: () => `<b>C_it (interface trap capacitance)</b> — reactive component of trap response. Frequency-dependent: C_it = D_it·arctan(ωτ_it)/(ωτ_it). Contributes to the low-frequency dispersion in C-V and the Cole-Cole arc depression.`
};
function showInfo(id){document.getElementById('info-panel').innerHTML=info[id]()}
function updateCircuit(){
  const grid=document.getElementById('param-grid');
  grid.innerHTML=[
    {l:'R_s',v:fmt(Rs(),'Ω')},
    {l:'C_ox',v:(Cox()*1e3).toFixed(1)+' mF/m²'},
    {l:'R_ox',v:fmt(Rox(),'Ω')},
    {l:'C_d',v:fmt(Cd()*Agate,'F')},
    {l:'D_it',v:Dit().toExponential(1)+' /cm²eV'},
    {l:'τ_it',v:fmt(tauIt(),'s')},
  ].map(p=>`<div class="param-card"><div class="label">${p.l}</div><div class="value">${p.v}</div></div>`).join('');
}
updateCircuit();
</script>
